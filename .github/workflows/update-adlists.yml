name: Update adlists

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-adlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync configured adlist sources
        env:
          YALIC_IMAGE: ghcr.io/rohzb/yalic:latest
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "${YALIC_IMAGE}" \
            yalic-pull -c /work/config/adlists.yaml

      - name: Commit changes
        run: |
          git add -A adlists/upstream

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          TS_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(adlists): sync upstream snapshots ${TS_UTC}"
          git push
