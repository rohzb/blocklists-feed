name: Update adlists

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build-adlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync and build configured adlist sources
        env:
          YALIC_IMAGE: ghcr.io/rohzb/yalic:v0.3.2
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "${YALIC_IMAGE}" \
            sh -lc "yalic-pull -c /work/config/adlists.yaml && yalic-build -c /work/config/adlists.yaml"

      - name: Commit changes
        run: |
          git add -A adlists

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          TS_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(adlists): sync and rebuild artifacts ${TS_UTC} [skip ci]"
          git push
