name: Rebuild result artifacts

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild feed and adlist results from synced snapshots
        env:
          YALIC_IMAGE: ghcr.io/rohzb/yalic:latest
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "${YALIC_IMAGE}" \
            sh -lc "yalic-build -c /work/config/feeds.yaml && yalic-build -c /work/config/adlists.yaml"

      - name: Commit changes
        run: |
          git add -A feeds/result
          git add -A adlists/result

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          TS_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(results): rebuild feed and adlist artifacts ${TS_UTC} [skip ci]"
          git push
